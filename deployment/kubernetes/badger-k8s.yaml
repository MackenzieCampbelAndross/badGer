apiVersion: v1
kind: Namespace
metadata:
  name: badger-system
  labels:
    app.kubernetes.io/name: badger
    app.kubernetes.io/part-of: badger-security
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: badger-control-plane
  namespace: badger-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: badger-workload-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: badger-workload-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: badger-workload-reader
subjects:
  - kind: ServiceAccount
    name: badger-control-plane
    namespace: badger-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: badger-control-plane
  namespace: badger-system
  labels:
    app: badger-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: badger-control-plane
  template:
    metadata:
      labels:
        app: badger-control-plane
    spec:
      serviceAccountName: badger-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: control-plane
          image: badger/control-plane:v1.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: BADGER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: badger-auth-secrets
                  key: auth-secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: badger-control-plane
  namespace: badger-system
spec:
  selector:
    app: badger-control-plane
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: badger-node-agent
  namespace: badger-system
  labels:
    app: badger-node-agent
spec:
  selector:
    matchLabels:
      app: badger-node-agent
  template:
    metadata:
      labels:
        app: badger-node-agent
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: node-agent
          image: badger/agent:v1.0.0
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - BPF
                - PERFMON
                - NET_ADMIN
          env:
            - name: CONTROL_PLANE_URL
              value: "http://badger-control-plane.badger-system.svc.cluster.local:8080"
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: false
            - name: bpf
              mountPath: /sys/fs/bpf
              readOnly: false
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
