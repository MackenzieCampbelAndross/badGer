[workspace]
resolver = "2"
members = [
    "crates/badger-common",
    "crates/badger-identity",
    "crates/badger-policy",
    "crates/badger-sandbox",
    "crates/badger-sensor",
    "crates/badger-threat",
    "crates/badger-containment",
    "crates/badger-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MackenzieCampbelAndross <mackenzieandross@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
